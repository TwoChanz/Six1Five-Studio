<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chandler Hopkins – Resume</title>
  <style>
    body {
      margin: 0;
      background-color: #0e1a2b;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="resumeCanvas"></canvas>

  <script>
    const canvas = document.getElementById('resumeCanvas');
    const ctx = canvas.getContext('2d');

    // Resize canvas to full screen
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      // Grow the canvas to fit the content so the page can scroll.
      const contentHeight = drawResume() + 50;
      if (contentHeight > canvas.height) {
        canvas.height = contentHeight;
        drawResume();
      }
    }

    window.addEventListener('resize', resizeCanvas, false);
    resizeCanvas();

    function drawResume() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const padX = 40;
      const padY = 50;
      let y = padY;

      ctx.font = 'bold 28px Arial';
      ctx.fillStyle = '#fca311';
      ctx.fillText('Chandler Hopkins', padX, y);
      ctx.font = '18px Arial';
      ctx.fillStyle = '#ffffff';
      y += 30;
      ctx.fillText('Founder | Reality Capture Specialist | AEC Technologist', padX, y);

      y += 30;
      ctx.fillStyle = '#00bcd4';
      ctx.fillText('Smyrna, TN | chandler@six1fivestudio.com', padX, y);

      y += 40;
      ctx.font = 'bold 22px Arial';
      ctx.fillStyle = '#fca311';
      ctx.fillText('🧭 Summary', padX, y);

      y += 30;
      ctx.font = '16px Arial';
      ctx.fillStyle = '#ffffff';
      const summary = [
        'Multidisciplinary Reality Capture professional combining a background in construction, agriculture,',
        'and site operations with a forward-thinking approach to digital transformation in AEC.',
        'Founder of Six1Five Studio, providing drone mapping, orthomosaics, 3D models, and Gaussian splats',
        'for construction progress, land listings, and site documentation in Middle Tennessee.'
      ];
      summary.forEach(line => {
        ctx.fillText(line, padX, y);
        y += 22;
      });

      y += 20;
      ctx.font = 'italic 14px Arial';
      ctx.fillStyle = '#00ff88';
      ctx.fillText('"From farm foundations to digital replicas—bringing real‑world sites into stunning 3D."', padX, y);

      y += 40;
      ctx.font = 'bold 22px Arial';
      ctx.fillStyle = '#fca311';
      ctx.fillText('🔧 Core Technologies & Skills', padX, y);

      y += 30;
      ctx.font = '16px Arial';
      ctx.fillStyle = '#ffffff';
      const skills = [
        'RealityCapture · Metashape · COLMAP · OpenSplat',
        'Point clouds: CloudCompare · FARO SCENE · Luma AI',
        'Gaussian Splatting · NeRFs · Photogrammetry',
        'Autodesk Construction Cloud · Revit',
        'Drone Deploy · ArcGIS · Sketchfab',
        'Python · OpenCV · PyTorch · Supabase · React'
      ];
      skills.forEach(line => {
        ctx.fillText('• ' + line, padX + 10, y);
        y += 22;
      });

      y += 30;
      ctx.font = 'bold 22px Arial';
      ctx.fillStyle = '#fca311';
      ctx.fillText('🛠️ Project Experience', padX, y);

      y += 30;
      ctx.font = 'bold 18px Arial';
      ctx.fillStyle = '#00bcd4';
      ctx.fillText('Six1Five Studio – Reality Capture Founder', padX, y);

      y += 22;
      ctx.font = '16px Arial';
      ctx.fillStyle = '#ffffff';
      ctx.fillText('Smyrna, TN – 2023–Present', padX, y);

      y += 22;
      ctx.fillText('• Captured & processed 3D scans of stadiums, towers, boats, and industrial sites.', padX + 10, y);
      y += 20;
      ctx.fillText('• Developed NeRF-based deliverables using Luma AI and Gaussian Splatting.', padX + 10, y);

      y += 30;
      ctx.font = 'bold 18px Arial';
      ctx.fillStyle = '#00bcd4';
      ctx.fillText('Legacy Cabinet Coatings – Crew Lead', padX, y);

      y += 22;
      ctx.font = '16px Arial';
      ctx.fillStyle = '#ffffff';
      ctx.fillText('Murfreesboro, TN – 2021–2022', padX, y);

      y += 22;
      ctx.fillText('• Managed 3-person crew refinishing full kitchens in 3-day cycles.', padX + 10, y);
      y += 20;
      ctx.fillText('• Coordinated client walk-throughs, prep, paint, and logistics.', padX + 10, y);

      y += 40;
      ctx.font = 'bold 22px Arial';
      ctx.fillStyle = '#fca311';
      ctx.fillText('🎓 Education', padX, y);
      y += 30;
      ctx.font = '16px Arial';
      ctx.fillStyle = '#ffffff';
      ctx.fillText('Concrete Industry Management (CIM) coursework at Middle Tennessee State University, including blueprint reading', padX, y);

      y += 40;
      ctx.font = 'bold 22px Arial';
      ctx.fillStyle = '#fca311';
      ctx.fillText('📜 Licenses & Certifications', padX, y);

      y += 30;
      ctx.font = '16px Arial';
      ctx.fillStyle = '#ffffff';
      const certifications = [
        'Construction Technology Certificate – DroneDeploy · Dec 2025',
        'DroneDeploy Fundamentals – DroneDeploy · Nov 2025',
        'DroneDeploy Ground Certified – DroneDeploy · Nov 2025',
        'Critical Thinking & Problem Solving – LinkedIn · May 2025',
        'Construction Technology: Industry Snapshot – LinkedIn Learning · Jan 2025',
        'Preprocessing Unstructured Data for LLM Applications – DeepLearning.AI · Dec 2024',
        'Reality Capture Foundations for AEC – LinkedIn · Mar 2024',
        'Generative AI Fundamentals – Google · Dec 2023',
        'Introduction to Generative AI – Google · Nov 2023',
        'Concrete Field Testing Technician - Grade I (CFTT) – American Concrete Institute · Feb 2019 – Feb 2024'
      ];
      certifications.forEach(line => {
        ctx.fillText('• ' + line, padX + 10, y);
        y += 22;
      });

      y += 40;
      ctx.font = 'bold 22px Arial';
      ctx.fillStyle = '#fca311';
      ctx.fillText('📍 Service Area: Rutherford County & Middle Tennessee', padX, y);

      return y;
    }
  </script>
</body>
</html>
